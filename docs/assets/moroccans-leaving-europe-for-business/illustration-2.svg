<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="600" height="400" rx="12" fill="#f5f6f8"/>
  <text x="40" y="58" font-size="21" font-weight="700" fill="#1b1d21">The diaspora sends home ~$12-13bn a year</text>
  <text x="40" y="84" font-size="14" fill="#5b6470">Nearly 10% of Morocco's GDP. Where that money goes:</text>

  <!-- stacked bar: 60 / 30 / 10 across 520px from x=40 -->
  <rect x="40"  y="120" width="312" height="60" fill="#c3c9d2"/>
  <rect x="352" y="120" width="156" height="60" fill="#8a94a3"/>
  <rect x="508" y="120" width="52"  height="60" fill="#2f6feb"/>
  <text x="196" y="156" font-size="18" font-weight="700" fill="#1b1d21" text-anchor="middle">60%</text>
  <text x="430" y="156" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">30%</text>
  <text x="534" y="205" font-size="16" font-weight="700" fill="#2f6feb" text-anchor="middle">10%</text>

  <!-- legend -->
  <rect x="40" y="238" width="14" height="14" fill="#c3c9d2"/>
  <text x="64" y="250" font-size="14" fill="#1b1d21">Household consumption</text>
  <rect x="40" y="266" width="14" height="14" fill="#8a94a3"/>
  <text x="64" y="278" font-size="14" fill="#1b1d21">Inactive savings &amp; real estate</text>
  <rect x="40" y="294" width="14" height="14" fill="#2f6feb"/>
  <text x="64" y="306" font-size="14" font-weight="700" fill="#1b1d21">Productive investment (businesses)</text>

  <line x1="40" y1="336" x2="560" y2="336" stroke="#e4e7eb" stroke-width="1"/>
  <text x="40" y="366" font-size="14" fill="#5b6470">Diaspora capital is about 10% of all private investment in Morocco.</text>
</svg>
