# Copy to newsletter.config.yaml and edit. This file drives every step of the
# newsletter workflow: research, drafting, site build, and publish.

# --- Identity -------------------------------------------------------------
publication: "Signal & Noise"
tagline: "A plain-language briefing, one topic at a time."
author: "Your Name"

# The live GitHub Pages URL. Set this AFTER Pages is enabled
# (Settings -> Pages -> Deploy from a branch -> main / /docs).
# Must end with a trailing slash.
base_url: "https://YOUR-USERNAME.github.io/YOUR-REPO/"

# --- Look --------------------------------------------------------------
theme:
  font_stack: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
  max_width_px: 680
  light:
    bg: "#ffffff"
    surface: "#f5f6f8"
    text: "#1b1d21"
    muted: "#5b6470"
    accent: "#2f6feb"
    border: "#e4e7eb"
  dark:
    bg: "#0f1115"
    surface: "#171a21"
    text: "#e8eaed"
    muted: "#9aa3af"
    accent: "#6ea8fe"
    border: "#2a2f3a"

# Links shown in the site footer. Paths are relative to base_url.
links:
  - label: "RSS"
    href: "feed.xml"

# --- Research ---------------------------------------------------------
research:
  recency_months: 6      # prefer sources newer than this
  model: ""              # blank -> $NEWSLETTER_MODEL, else the built-in default

# --- Illustrations --------------------------------------------------------
# Appended to every image brief so all issues share one visual language.
illustration_style: >
  Editorial vector illustration, flat geometric shapes, limited palette of
  slate blue, warm grey and off-white, generous negative space, soft grain,
  no text, no logos, no watermarks. 3:2 aspect ratio.
